name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '4.0.8'
          bundler-cache: true
      - name: Check packaged files are readable by non-owner users
        shell: bash
        run: |
          umask 077
          chmod 600 lib/llm_gateway.rb
          bin/build-gem
          tar -xOf pkg/llm_gateway-*.gem data.tar.gz | tar -tzvf - |
            awk 'substr($1, 1, 1) == "-" { files++; if (substr($1, 8, 1) != "r") bad++ } END { exit (!files || bad) }'
      - name: Run the default task
        run: bundle exec rake
